name: Publish shō Pages audio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-pages-audio.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download generated WAV artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/sho-audio
          mkdir -p /tmp/sho-audio
          gh run download 36294819923 --repo "${GITHUB_REPOSITORY}" --name "sho-kashira-audio-render-36294819923" --dir /tmp/sho-audio
          find /tmp/sho-audio -maxdepth 3 -type f -print
      - name: Convert public listening copies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p audio
          for f in /tmp/sho-audio/*.wav /tmp/sho-audio/*/*.wav; do
            [ -f "$f" ] || continue
            base="$(basename "$f" .wav)"
            ffmpeg -v error -y -i "$f" -c:a libopus -b:a 24k "audio/${base}.opus"
          done
          test -s audio/single-blow-k370.opus
          test -s audio/single-draw-k90.opus
          test -s audio/chord-blow-k600.opus
          test -s audio/chord-draw-k600.opus
      - name: Commit audio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/*.opus
          git diff --cached --quiet && exit 0
          git commit -m "Publish shō Pages audio samples"
          git pull --rebase origin main
          git push origin HEAD:main
