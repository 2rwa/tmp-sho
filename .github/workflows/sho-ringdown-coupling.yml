name: Shō zero-source ringdown coupling diagnostic

on:
  push:
    branches: [main]
    paths:
      - "scripts/wave4/ringdown-coupling.mjs.part"
      - ".github/workflows/sho-ringdown-coupling.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        pump: [0.4, 0.0]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Assemble exact-zero library
        run: |
          set -euo pipefail
          cat scripts/kashira-coupling/*.mjs.part > /tmp/full.mjs
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/full.mjs').read_text()
          marker='\nconst directReference = {'
          if marker not in src: raise SystemExit('library marker not found')
          s=src.split(marker,1)[0]+'\n'
          s=s.replace("const absolutePressure = Math.max(Math.abs(pressureDifference), 1e-5);","const absolutePressure = Math.abs(pressureDifference);")
          s=s.replace("const pressureSign = pressureDifference >= 0 ? 1 : -1;","const pressureSign = pressureDifference === 0 ? 0 : (pressureDifference > 0 ? 1 : -1);")
          p="${{ matrix.pump }}"
          s=s.replace("const pumpedFlow = 0.4 *",f"const pumpedFlow = {p} *")
          s=s.replace("const netInputFlow = flowVelocity + 0.4 *",f"const netInputFlow = flowVelocity + {p} *")
          Path('/tmp/lib.mjs').write_text(s)
          PY
          cat /tmp/lib.mjs scripts/wave4/ringdown-coupling.mjs.part > /tmp/test.mjs
          node --check /tmp/test.mjs
      - name: Run diagnostic
        env:
          PUMP_SCALE: ${{ matrix.pump }}
        run: node /tmp/test.mjs --out=results-ringdown-coupling
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sho-ringdown-coupling-pump-${{ matrix.pump }}-${{ github.run_id }}
          path: results-ringdown-coupling/
          retention-days: 14
