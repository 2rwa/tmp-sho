name: Shō all-pipe threshold census

on:
  push:
    branches: [main]
    paths:
      - "scripts/kashira-studies-extra/**"
      - ".github/workflows/kashira-pipe-threshold-census.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Assemble model library
        run: |
          set -euo pipefail
          cat scripts/kashira-coupling/*.mjs.part > /tmp/kashira-full.mjs
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/kashira-full.mjs').read_text()
          marker='\nconst directReference = {'
          if marker not in src:
              raise SystemExit('library marker not found')
          Path('/tmp/kashira-library.mjs').write_text(src.split(marker,1)[0]+'\n')
          PY
          cat /tmp/kashira-library.mjs scripts/kashira-studies-extra/05-extra-studies.mjs.part > /tmp/kashira-extra.mjs
          node --check /tmp/kashira-extra.mjs

      - name: Run pipe-threshold-census
        run: node /tmp/kashira-extra.mjs --extra-study=pipe-threshold-census --out=results-pipe-threshold-census

      - name: Upload pipe-threshold-census artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sho-kashira-pipe-threshold-census-${{ github.run_id }}
          path: results-pipe-threshold-census/
          retention-days: 14
