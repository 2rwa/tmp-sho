name: Shō FFT STFT audio diagnostics

on:
  push:
    branches: [main]
    paths:
      - "scripts/wave4/audio_diag.py"
      - ".github/workflows/sho-audio-fft-stft.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Download source WAV artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/wav
          gh run download 36294819923 --repo "${GITHUB_REPOSITORY}" --name "sho-kashira-audio-render-36294819923" --dir /tmp/wav
          find /tmp/wav -type f -maxdepth 3 -print
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Analyze FFT and STFT
        run: python scripts/wave4/audio_diag.py --input /tmp/wav --out results-audio-fft-stft
      - uses: actions/upload-artifact@v4
        with:
          name: sho-wave4-audio-fft-stft-${{ github.run_id }}
          path: results-audio-fft-stft/
          retention-days: 14
