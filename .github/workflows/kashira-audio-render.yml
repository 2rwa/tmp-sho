name: Shō shared-kashira audio render

on:
  push:
    branches: [main]
    paths:
      - "scripts/kashira-studies-wave3/**"
      - ".github/workflows/kashira-audio-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Assemble model library
        run: |
          set -euo pipefail
          cat scripts/kashira-coupling/*.mjs.part > /tmp/kashira-full.mjs
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/kashira-full.mjs').read_text()
          marker='\nconst directReference = {'
          if marker not in src:
              raise SystemExit('library marker not found')
          Path('/tmp/kashira-library.mjs').write_text(src.split(marker,1)[0]+'\n')
          PY
          cat /tmp/kashira-library.mjs scripts/kashira-studies-wave3/06-wave3.mjs.part > /tmp/kashira-wave3.mjs
          node --check /tmp/kashira-wave3.mjs

      - name: Run audio-render
        run: node /tmp/kashira-wave3.mjs --wave3-study=audio-render --out=results-audio-render

      - name: Upload audio-render artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sho-kashira-audio-render-${{ github.run_id }}
          path: results-audio-render/
          retention-days: 14
