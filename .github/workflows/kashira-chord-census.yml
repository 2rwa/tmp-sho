name: Shō all-chord kashira census

on:
  push:
    branches: [main]
    paths:
      - "scripts/kashira-coupling/**"
      - "scripts/kashira-studies/**"
      - ".github/workflows/kashira-chord-census.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Assemble and syntax-check study runner
        run: |
          cat scripts/kashira-coupling/*.mjs.part scripts/kashira-studies/04-parallel-studies.mjs.part > /tmp/kashira-study.mjs
          node --check /tmp/kashira-study.mjs

      - name: Run chord-census
        run: node /tmp/kashira-study.mjs --study=chord-census --out=results-chord-census

      - name: Upload chord-census artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sho-kashira-chord-census-${{ github.run_id }}
          path: results-chord-census/
          retention-days: 14
